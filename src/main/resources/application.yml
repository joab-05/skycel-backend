spring:
  application:
    name: skycel-backend
  config:
    # Credenciales fuera de Git: ver secrets.example.yml. Las variables de entorno tienen prioridad.
    import: optional:classpath:secrets.yml
  threads:
    virtual:
      enabled: true  # Habilita Virtual Threads en Tomcat
    
  datasource:
    url: jdbc:mysql://localhost:3306/skyceldb2?serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver
    type: com.zaxxer.hikari.HikariDataSource
    hikari:
      pool-name: SkycelHikariPool
      minimum-idle: 5
      maximum-pool-size: 20
      idle-timeout: 30000
      max-lifetime: 1800000
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: update # Cambiado temporalmente a update para que Envers pueda crear sus tablas _AUD automáticamente
    show-sql: false # Cambiar a true en entorno DEV
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
        envers:
          audit_table_suffix: _AUD
          store_data_at_delete: true # Permite saber el estado exacto del registro antes de que el usuario lo borrara
          
  cache:
    type: caffeine
    caffeine:
      spec: maximumSize=500,expireAfterWrite=60m # Mantiene catálogos por 60 min en la memoria JVM
      
  security:
    jwt:
      secret: ${JWT_SECRET} # Cadena aleatoria de 64+ caracteres (HS512). Se define en secrets.yml o como variable de entorno
      expiration-ms: 43200000 # 12 horas de duración del Token

springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operationsSorter: method

server:
  port: 8080
  # Comprime las respuestas JSON/HTML/JS/CSS grandes (solo si el cliente lo pide con Accept-Encoding: los navegadores
  # sí; el listado de un catálogo de ~2,000 productos baja de ~1.8 MB a ~150 KB).
  compression:
    enabled: true
    mime-types: application/json,text/html,text/css,application/javascript,text/javascript
    min-response-size: 2048
  # Detrás de Caddy (HTTPS en /app y en la API): toma el esquema/host reales de los encabezados
  # X-Forwarded-* en vez de ver siempre "http" y el puerto 8080.
  forward-headers-strategy: framework
  error:
    include-message: always
    include-binding-errors: always
