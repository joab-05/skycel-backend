# Copia este archivo como secrets.yml (mismo directorio) y pon tus valores. secrets.yml no se sube a Git.
# Tambien puedes usar variables de entorno DB_USERNAME, DB_PASSWORD y JWT_SECRET, que tienen prioridad.
DB_USERNAME: tu_usuario_mysql
DB_PASSWORD: tu_contrasena_mysql
# Cadena aleatoria de 64 o mas caracteres (se usa tal cual para firmar con HS512). Generar una:  python -c "import secrets,base64; print(base64.b64encode(secrets.token_bytes(64)).decode())"
JWT_SECRET: "cambia-esto-por-una-cadena-aleatoria-de-64-o-mas-caracteres-xxxxxxxxxxxxxxxxxxxx"
